<app-list-conf></app-list-conf>
<<app-profil-utilisateur></app-profil-utilisateur>
<h2>Liste des conférences</h2>

<input
  type="text"
  name="search"
  class="form-control"
  placeholder="Search by title..."
  [(ngModel)]="searchTitle"
>

<h1>{{ searchTitle }}</h1>

<table class="table">
  <thead>
  <tr>
    <th>Titre</th>
    <th>Date</th>
    <th>Available places</th>
    <th>Action</th>
  </tr>
  </thead>

  <tbody>
    @for (conf of list; track conf.title) {
      @if (searchTitle === conf.title || searchTitle==null ) {
        <tr>
          <td>{{ conf.title || uppercase }}</td>
          <td>{{ conf.date }}</td>
          <td>{{ conf.nbrMax - conf.nbrRevervation }}</td>
          <td>
            <button
              [disabled]="conf.nbrMax == conf.nbrRevervation"
              (click)="participate(conf)">
              Participate
            </button>
          </td>
        </tr>
      }
    }
  </tbody>
</table>
