<div class="container py-5">

  <div class="text-center mb-5">
    <h2 class="fw-bold">Nos conférences</h2>
    <p class="text-muted">Découvrez nos prochaines conférences et réservez votre place.</p>
  </div>

  <div class="row g-4">

    <div class="col-md-6 col-lg-3" *ngFor="let conf of conferences">

      <div class="card conference-card h-100 shadow-sm">

        <img [src]="conf.picture"
             class="card-img-top"
             [alt]="conf.title">

        <div class="card-body">

          <h5 class="card-title fw-bold">{{ conf.title }}</h5>

          <p class="text-muted mb-2">
            <i class="bi bi-calendar-event"></i>
            {{ conf.date }}
          </p>

          <p class="text-muted mb-3">
            <i class="bi bi-geo-alt"></i>
            {{ conf.address }}
          </p>

          <span *ngIf="conf.available_places > 0"
                class="badge bg-success">
            {{ conf.available_places }} places disponibles
          </span>

          <span *ngIf="conf.available_places === 0"
                class="badge bg-danger">
            Complet
          </span>

        </div>

        <div class="card-footer bg-white border-0">
          <button class="btn btn-primary w-100"
                  [disabled]="conf.available_places === 0">
            Voir détails
          </button>
        </div>

      </div>

    </div>

  </div>
</div>
